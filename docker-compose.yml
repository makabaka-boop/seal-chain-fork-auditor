name: evidence-audit

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: evidence-audit-api:latest
    container_name: evidence-audit-api
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
